<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Test UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f5f6f8; color: #333; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
        .sidebar-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .sidebar-header h2 span { background: #eef2ff; color: #5a67d8; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
        
        .search-container { padding: 15px 20px; }
        .search-container input { width: 100%; padding: 10px 15px; border: 1px solid #e0e0e0; border-radius: 20px; outline: none; background: #f9fafb; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; padding: 15px 20px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f0f0f0; }
        .chat-item:hover, .chat-item.active { background: #f5f7ff; }
        .chat-item img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
        .chat-item-info { flex: 1; overflow: hidden; }
        .chat-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .chat-item-header h4 { font-size: 15px; font-weight: 600; color: #1a202c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item-header span { font-size: 12px; color: #a0aec0; }
        .chat-item-desc { font-size: 13px; color: #718096; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .add-chat-btn { margin: 15px 20px; padding: 12px; background: #eef2ff; color: #5a67d8; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #fff; }
        
        .chat-header { padding: 20px 30px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; justify-content: space-between; }
        .chat-header-user { display: flex; align-items: center; gap: 15px; }
        .chat-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .chat-header-info h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .status-online { display: inline-flex; align-items: center; font-size: 12px; color: #48bb78; background: #f0fff4; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .status-online::before { content: ''; width: 6px; height: 6px; background: #48bb78; border-radius: 50%; margin-right: 5px; }
        .chat-header-info p { font-size: 13px; color: #a0aec0; margin-top: 2px; }

        .chat-body { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #fafbfc; }
        
        .date-divider { text-align: center; margin: 20px 0; position: relative; }
        .date-divider span { background: #fafbfc; padding: 0 15px; font-size: 12px; color: #a0aec0; position: relative; z-index: 2; }
        .date-divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e2e8f0; z-index: 1; }

        .message { max-width: 60%; display: flex; flex-direction: column; position: relative; }
        .message-received { align-self: flex-start; }
        .message-sent { align-self: flex-end; }
        
        .message-content { padding: 12px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; position: relative; }
        .message-received .message-content { background: #fff; color: #2d3748; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .message-sent .message-content { background: #5a67d8; color: #fff; border-bottom-right-radius: 2px; }
        
        .message-time { font-size: 11px; margin-top: 5px; color: #a0aec0; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
        .message-sent .message-time { color: #a0aec0; }
        .message-received .message-time { text-align: left; justify-content: flex-start;}
        
        .file-attachment { display: flex; align-items: center; gap: 15px; padding: 10px; background: #f7fafc; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 5px; }
        .file-attachment img { width: 30px; height: 30px; }
        .file-info { display: flex; flex-direction: column; }
        .file-info .filename { font-weight: 600; font-size: 14px; color: #2d3748; }
        .file-info .filesize { font-size: 12px; color: #718096; }

        .media-attachment { max-width: 300px; border-radius: 8px; overflow: hidden; margin-bottom: 5px; }
        .media-attachment img, .media-attachment video { width: 100%; display: block; }
        
        .audio-attachment { display: flex; align-items: center; background: #5a67d8; border-radius: 25px; padding: 8px 15px; color: white; gap: 10px; width: 250px; margin-bottom: 5px;}
        .play-btn { width: 30px; height: 30px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #5a67d8; }

        /* Input Area */
        .chat-input-area { padding: 20px 30px; background: #fff; border-top: 1px solid #e0e0e0; }
        .input-wrapper { display: flex; align-items: center; background: #f9fafb; border: 1px solid #e2e8f0; border-radius: 24px; padding: 8px 15px; gap: 15px; }
        .input-wrapper input[type="text"] { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; padding: 8px 0; }
        .input-actions { display: flex; align-items: center; gap: 12px; color: #a0aec0; cursor: pointer; }
        .input-actions svg { width: 20px; height: 20px; transition: color 0.2s; }
        .input-actions svg:hover { color: #5a67d8; }
        
        .send-btn { background: #5a67d8; color: #fff; border: none; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: #4c51bf; }

        /* Typing Indicator */
        .typing-indicator { display: none; align-items: center; gap: 4px; padding: 12px 18px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; border-bottom-left-radius: 2px; width: max-content; align-self: flex-start; margin-bottom: 15px; }
        .typing-indicator span { display: block; width: 6px; height: 6px; background: #a0aec0; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Auth Panel for testing */
        #authPanel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #fff; padding: 30px; border-radius: 12px; width: 400px; }
        .auth-box h3 { margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        .auth-box button { width: 100%; padding: 10px; background: #5a67d8; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <!-- Auth Panel -->
    <div id="authPanel">
        <div class="auth-box">
            <h3>Login to Test Chat</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Enter your API Bearer Token to connect</p>
            <input type="text" id="tokenInput" placeholder="Enter Bearer Token...">
            <button onclick="connectChat()">Connect</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Messages <span>29</span></h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search..." id="searchInput" onkeyup="searchChats()">
        </div>
        <div class="chat-list" id="chatList">
            <!-- Chats will be loaded here -->
        </div>
        <button class="add-chat-btn" onclick="startNewChat()">+ Add New Chat</button>
    </div>

    <!-- Main Chat -->
    <div class="main-chat" id="mainChat" style="display: none;">
        <div class="chat-header">
            <div class="chat-header-user">
                <img id="activeChatAvatar" src="https://via.placeholder.com/45" alt="Avatar">
                <div class="chat-header-info">
                    <h3><span id="activeChatName">User Name</span> <span class="status-online" id="activeChatStatus">Online</span></h3>
                    <p id="activeChatUsername">@username</p>
                </div>
            </div>
            <div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="date-divider"><span>Today</span></div>
            <!-- Messages will be loaded here -->
            
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                <div onclick="document.getElementById('fileInput').click()" style="cursor:pointer; display:flex; align-items:center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </div>
                
                <input type="text" id="messageInput" placeholder="Send a message..." onkeypress="handleTyping(event)">
                
                <div class="input-actions" style="position: relative;">
                    <div id="emojiPicker" style="display: none; position: absolute; bottom: 40px; right: 0; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 8px; width: 150px; flex-wrap: wrap; gap: 5px; z-index: 100;">
                        <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('😀')">😀</span> <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('😂')">😂</span> <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('❤️')">❤️</span> <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('👍')">👍</span> <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('🔥')">🔥</span> <span style="cursor:pointer; font-size:18px;" onclick="addEmoji('🎉')">🎉</span>
                    </div>
                    
                    <div onclick="toggleEmojiPicker()" style="cursor:pointer; display:flex; align-items:center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                    </div>
                    
                    <div onclick="toggleVoiceRecording()" id="micBtn" style="cursor:pointer; display:flex; align-items:center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </div>
                    
                    <button class="send-btn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
            <div id="filePreview" style="display: none; padding: 5px; font-size: 12px; color: #5a67d8;"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1';
        let socket;
        let token = localStorage.getItem('chatToken') || '';
        let currentRoomId = null;

        window.onload = () => {
            if (token) {
                document.getElementById('tokenInput').value = token;
                connectChat();
            }
        };

        async function connectChat() {
            token = document.getElementById('tokenInput').value;
            if (!token) return alert('Please enter token');
            localStorage.setItem('chatToken', token);
            
            // Connect socket
            socket = io('http://localhost:3000', {
                auth: { token }
            });

            socket.on('connect', () => {
                document.getElementById('authPanel').style.display = 'none';
                loadChatList();
            });

            socket.on('connect_error', (err) => {
                alert('Connection Failed: ' + err.message);
            });

            // Socket Listeners
            socket.on('receive_message', (msg) => {
                console.log('Received message via socket:', msg);
                if (msg.roomId === currentRoomId) {
                    appendMessage(msg);
                    scrollToBottom();
                }
                loadChatList(); // refresh sidebar
            });

            socket.on('user_online', () => loadChatList());
            socket.on('user_offline', () => loadChatList());

            socket.on('user_typing', ({ roomId }) => {
                if (roomId === currentRoomId) {
                    const indicator = document.getElementById('typingIndicator');
                    if (indicator) {
                        document.getElementById('chatBody').appendChild(indicator); // Move to bottom
                        indicator.style.display = 'flex';
                        scrollToBottom();
                    }
                }
            });

            socket.on('user_stopped_typing', ({ roomId }) => {
                if (roomId === currentRoomId) {
                    const indicator = document.getElementById('typingIndicator');
                    if (indicator) indicator.style.display = 'none';
                }
            });
        }

        async function loadChatList(search = '') {
            try {
                const res = await fetch(`${API_URL}/chat/list?search=${search}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const listEl = document.getElementById('chatList');
                listEl.innerHTML = '';
                
                data.data.forEach(chat => {
                    const el = document.createElement('div');
                    el.className = `chat-item ${chat.roomId === currentRoomId ? 'active' : ''}`;
                    el.onclick = () => openChat(chat);
                    
                    const time = chat.lastMessage ? new Date(chat.lastMessage.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    const lastMsg = chat.lastMessage ? (chat.lastMessage.content || chat.lastMessage.fileName || 'Attachment') : 'No messages yet';
                    
                    el.innerHTML = `
                        <img src="${chat.user.avatar || 'https://via.placeholder.com/45'}" alt="User">
                        <div class="chat-item-info">
                            <div class="chat-item-header">
                                <h4>${chat.user.name}</h4>
                                <span>${time}</span>
                            </div>
                            <div class="chat-item-desc">${lastMsg}</div>
                        </div>
                    `;
                    listEl.appendChild(el);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function openChat(chat) {
            if (currentRoomId) {
                socket.emit('leave_room', { roomId: currentRoomId });
            }
            
            currentRoomId = chat.roomId;
            socket.emit('join_room', { roomId: currentRoomId });
            
            // Mark read
            socket.emit('mark_read', { roomId: currentRoomId });
            await fetch(`${API_URL}/chat/${currentRoomId}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            document.getElementById('mainChat').style.display = 'flex';
            document.getElementById('activeChatName').innerText = chat.user.name;
            document.getElementById('activeChatUsername').innerText = '@' + chat.user.username;
            document.getElementById('activeChatAvatar').src = chat.user.avatar || 'https://via.placeholder.com/45';
            document.getElementById('activeChatStatus').style.display = chat.user.isOnline ? 'inline-flex' : 'none';

            // Load messages
            const res = await fetch(`${API_URL}/chat/${currentRoomId}/messages?limit=50`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            const body = document.getElementById('chatBody');
            body.innerHTML = '<div class="date-divider"><span>Today</span></div>';
            
            // Reverse because API returns latest first
            data.data.messages.reverse().forEach(appendMessage);
            
            // Re-add typing indicator
            const typingInd = document.createElement('div');
            typingInd.className = 'typing-indicator';
            typingInd.id = 'typingIndicator';
            typingInd.innerHTML = '<span></span><span></span><span></span>';
            body.appendChild(typingInd);

            scrollToBottom();
            
            loadChatList();
        }

        function appendMessage(msg) {
            const body = document.getElementById('chatBody');
            const isMe = msg.sender.name !== document.getElementById('activeChatName').innerText; // simplistic check
            
            const el = document.createElement('div');
            el.className = `message ${isMe ? 'message-sent' : 'message-received'}`;
            
            let contentHtml = '';
            
            if (msg.fileUrl) {
                if (msg.fileType === 'image') {
                    contentHtml += `<div class="media-attachment"><img src="${msg.fileUrl}"></div>`;
                } else if (msg.fileType === 'video') {
                    contentHtml += `<div class="media-attachment"><video controls src="${msg.fileUrl}"></video></div>`;
                } else if (msg.fileType === 'audio') {
                    contentHtml += `<div class="audio-attachment"><audio controls src="${msg.fileUrl}" style="max-width: 200px;"></audio></div>`;
                } else {
                    contentHtml += `
                        <div class="file-attachment">
                            <div class="file-info">
                                <a href="${msg.fileUrl}" target="_blank" class="filename" style="color: blue; text-decoration: underline;">${msg.fileName}</a>
                            </div>
                        </div>`;
                }
            }
            
            if (msg.content) {
                contentHtml += `<div>${msg.content}</div>`;
            }

            const time = new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            el.innerHTML = `
                <div class="message-content">
                    ${contentHtml}
                    <div class="message-time">${time} ${isMe ? '✓✓' : ''}</div>
                </div>
            `;
            body.appendChild(el);
        }

        let selectedFile = null;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'none' ? 'flex' : 'none';
        }

        function addEmoji(emoji) {
            document.getElementById('messageInput').value += emoji;
            toggleEmojiPicker();
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('filePreview').style.display = 'block';
                document.getElementById('filePreview').innerText = 'Selected file: ' + selectedFile.name;
            }
        }

        async function toggleVoiceRecording() {
            if (!isRecording) {
                // Start recording
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => {
                    audioChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    selectedFile = audioBlob;
                    selectedFile.name = 'voice-message.webm';
                    document.getElementById('filePreview').style.display = 'block';
                    document.getElementById('filePreview').innerText = 'Voice message recorded. Click send.';
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('micBtn').style.color = 'red';
            } else {
                // Stop recording
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                document.getElementById('micBtn').style.color = '';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content && !selectedFile && !currentRoomId) return;

            input.value = '';
            
            const formData = new FormData();
            formData.append('content', content);
            if (selectedFile) {
                formData.append('file', selectedFile, selectedFile.name);
            }
            
            // reset file selection
            selectedFile = null;
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('filePreview').innerText = '';
            document.getElementById('fileInput').value = '';
            
            try {
                const res = await fetch(`${API_URL}/chat/${currentRoomId}/messages`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                console.log('Message sent API response:', data);
            } catch (err) {
                console.error('Error sending message:', err);
            }
        }

        let typingTimeout = null;

        function handleTyping(e) {
            if (e.key === 'Enter') {
                sendMessage();
            } else {
                if (currentRoomId) {
                    socket.emit('typing', { roomId: currentRoomId });
                    
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        socket.emit('stop_typing', { roomId: currentRoomId });
                    }, 1500);
                }
            }
        }

        function searchChats() {
            const val = document.getElementById('searchInput').value;
            loadChatList(val);
        }

        async function startNewChat() {
            const targetId = prompt("Enter User ID to start chat:");
            if (!targetId) return;
            try {
                const res = await fetch(`${API_URL}/chat/room`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetUserId: targetId })
                });
                const data = await res.json();
                if (data.status === 'error' || !data.success) {
                    return alert(data.message || 'Error creating chat');
                }
                loadChatList();
                openChat({ roomId: data.data.id, user: data.data.participants.find(p=>p.userId===targetId).user });
            } catch (err) {
                alert('Error creating chat');
            }
        }

        function scrollToBottom() {
            const body = document.getElementById('chatBody');
            body.scrollTop = body.scrollHeight;
        }
    </script>
</body>
</html>
